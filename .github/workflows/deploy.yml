name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm install -g firebase-tools
      - run: firebase deploy --only hosting:ptidej-f26a2,firestore:rules --project ptidej-f26a2 --token ${{ secrets.FIREBASE_TOKEN }}
